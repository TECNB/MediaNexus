server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    root /usr/share/nginx/html;
    index index.html;

    # 固定豆瓣 CDN 和公开海报路径，不接受任意 URL 或透传用户凭据。
    location ~ ^/douban-posters/(?<douban_cdn>img[1-9])(?<douban_poster>/view/photo/[a-z_]+/public/p[0-9]+\.jpg)$ {
        resolver 127.0.0.11 valid=300s;
        limit_except GET { deny all; }
        proxy_pass https://$douban_cdn.doubanio.com$douban_poster;
        proxy_ssl_server_name on;
        proxy_ssl_name $douban_cdn.doubanio.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $douban_cdn.doubanio.com;
        proxy_set_header Referer https://movie.douban.com/;
        proxy_set_header User-Agent "MediaNexus/1.0 (read-only public catalog)";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        expires 1d;
    }

    location /douban-posters/ {
        return 404;
    }

    location = /java-api {
        return 308 /java-api/;
    }

    location /java-api/ {
        proxy_pass http://medianexus_orchestrator:8080/;
        proxy_http_version 1.1;
        proxy_read_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
